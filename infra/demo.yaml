AWSTemplateFormatVersion: "2010-09-09"
Description: Despliegue minimo de API y PostgreSQL para el piloto R4.

Parameters:
  AllowedCidr:
    Type: String
    Description: IPv4 autorizada para ejecutar la prueba Postman/Newman.
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/32$"
  ContainerImage:
    Type: String
    Description: Imagen inmutable de la API en ECR.
  DatabasePassword:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Clave generada para PostgreSQL; no se almacena en el repositorio.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Resources:
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub tesis-r4-backups-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: RetainDemoBackups
            Status: Enabled
            ExpirationInDays: 35
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: tesis
        - Key: Environment
          Value: demo
        - Key: Owner
          Value: kevin
        - Key: ManagedBy
          Value: iac

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub ${BackupBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acceso restringido a la API del piloto R4
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3100
          ToPort: 3100
          CidrIp: !Ref AllowedCidr
          Description: Postman Newman desde la IP autorizada
      Tags:
        - Key: Name
          Value: tesis-r4-api
        - Key: Project
          Value: tesis
        - Key: Environment
          Value: demo
        - Key: Owner
          Value: kevin
        - Key: ManagedBy
          Value: iac

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tesis-r4-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: PullR4Image
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/tesis-r4-api
        - PolicyName: BackupR4Database
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt BackupBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${BackupBucket.Arn}/r4/*
      Tags:
        - Key: Project
          Value: tesis
        - Key: Environment
          Value: demo
        - Key: Owner
          Value: kevin
        - Key: ManagedBy
          Value: iac

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  DemoInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t4g.micro
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds:
        - !GetAtt ApiSecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 10
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker
          systemctl enable --now docker
          docker network create tesis-r4 || true
          docker volume create tesis-r4-postgres
          docker run -d \
            --name tesis-r4-postgres \
            --restart unless-stopped \
            --network tesis-r4 \
            --health-cmd='pg_isready -U tesis -d tesis' \
            --health-interval=5s \
            --health-timeout=3s \
            --health-retries=20 \
            -e POSTGRES_DB=tesis \
            -e POSTGRES_USER=tesis \
            -e POSTGRES_PASSWORD='${DatabasePassword}' \
            -v tesis-r4-postgres:/var/lib/postgresql/data \
            postgres:17-alpine
          until [ "$(docker inspect -f '{{.State.Health.Status}}' tesis-r4-postgres)" = healthy ]; do sleep 2; done
          aws ecr get-login-password --region ${AWS::Region} | \
            docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}
          docker run -d \
            --name tesis-r4-api \
            --restart unless-stopped \
            --network tesis-r4 \
            -p 3100:3100 \
            -e NODE_ENV=demo \
            -e PORT=3100 \
            -e DATABASE_URL='postgresql://tesis:${DatabasePassword}@tesis-r4-postgres:5432/tesis' \
            ${ContainerImage}
          install -m 0750 /dev/stdin /usr/local/sbin/tesis-r4-backup <<'BACKUP_SCRIPT'
          #!/bin/bash
          set -euo pipefail
          backup_timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup_file="/var/tmp/tesis-r4-$backup_timestamp.dump"
          checksum_file="$backup_file.sha256"
          docker exec tesis-r4-postgres pg_dump -U tesis -d tesis --format=custom > "$backup_file"
          sha256sum "$backup_file" > "$checksum_file"
          aws s3 cp "$backup_file" "s3://${BackupBucket}/r4/$backup_timestamp.dump" --sse AES256 --only-show-errors
          aws s3 cp "$checksum_file" "s3://${BackupBucket}/r4/$backup_timestamp.dump.sha256" --sse AES256 --only-show-errors
          rm -f "$backup_file" "$checksum_file"
          BACKUP_SCRIPT
          install -m 0644 /dev/stdin /etc/systemd/system/tesis-r4-backup.service <<'BACKUP_SERVICE'
          [Unit]
          Description=Copia cifrada de PostgreSQL para R4
          After=docker.service
          Requires=docker.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/tesis-r4-backup
          BACKUP_SERVICE
          install -m 0644 /dev/stdin /etc/systemd/system/tesis-r4-backup.timer <<'BACKUP_TIMER'
          [Unit]
          Description=Programación diaria de la copia PostgreSQL de R4

          [Timer]
          OnCalendar=daily
          Persistent=true
          RandomizedDelaySec=10m

          [Install]
          WantedBy=timers.target
          BACKUP_TIMER
          systemctl daemon-reload
          systemctl enable --now tesis-r4-backup.timer
      Tags:
        - Key: Name
          Value: tesis-r4-demo
        - Key: Project
          Value: tesis
        - Key: Environment
          Value: demo
        - Key: Owner
          Value: kevin
        - Key: ManagedBy
          Value: iac

Outputs:
  InstanceId:
    Description: Instancia del piloto R4.
    Value: !Ref DemoInstance
  ApiBaseUrl:
    Description: URL restringida para Postman/Newman.
    Value: !Sub http://${DemoInstance.PublicIp}:3100
  BackupBucketName:
    Description: Repositorio externo cifrado para las copias PostgreSQL de R4.
    Value: !Ref BackupBucket
