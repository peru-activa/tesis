AWSTemplateFormatVersion: "2010-09-09"
Description: Identidad CLI de minimo privilegio para desplegar el piloto de la tesis.

Resources:
  Deployer:
    Type: AWS::IAM::User
    Properties:
      UserName: tesis-deployer
      Tags:
        - Key: Project
          Value: tesis
        - Key: Environment
          Value: demo
        - Key: Owner
          Value: kevin
        - Key: ManagedBy
          Value: iac
      ManagedPolicyArns:
        - !Ref DeploymentPolicy

  DeploymentPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: tesis-r4-deployment
      Description: Permisos limitados para desplegar la demostracion R4 en us-east-1.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ManageNamedCloudFormationStacks
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:ContinueUpdateRollback
              - cloudformation:DeleteStack
              - cloudformation:CreateChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
              - cloudformation:ValidateTemplate
            Resource:
              - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/tesis-r4-*/*
          - Sid: ReadAccountAndInfrastructure
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
              - ec2:Describe*
              - ecr:Describe*
              - ecr:GetAuthorizationToken
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:DescribeInstanceInformation
            Resource: "*"
          - Sid: ManageR4EcrRepository
            Effect: Allow
            Action:
              - ecr:CreateRepository
              - ecr:DeleteRepository
              - ecr:TagResource
              - ecr:UntagResource
              - ecr:PutImageScanningConfiguration
              - ecr:PutImageTagMutability
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:BatchCheckLayerAvailability
              - ecr:PutImage
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource: !Sub arn:${AWS::Partition}:ecr:us-east-1:${AWS::AccountId}:repository/tesis-r4-api
          - Sid: ManageDemoEc2
            Effect: Allow
            Action:
              - ec2:RunInstances
              - ec2:StartInstances
              - ec2:StopInstances
              - ec2:ModifyInstanceAttribute
              - ec2:TerminateInstances
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:CreateTags
              - ec2:DeleteTags
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: us-east-1
          - Sid: ManageNamedInstanceRole
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:TagRole
              - iam:UntagRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PassRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/tesis-r4-*
          - Sid: ManageNamedInstanceProfile
            Effect: Allow
            Action:
              - iam:CreateInstanceProfile
              - iam:DeleteInstanceProfile
              - iam:GetInstanceProfile
              - iam:AddRoleToInstanceProfile
              - iam:RemoveRoleFromInstanceProfile
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/tesis-r4-*
          - Sid: InspectDemoThroughSsm
            Effect: Allow
            Action:
              - ssm:SendCommand
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:us-east-1::document/AWS-RunShellScript
              - !Sub arn:${AWS::Partition}:ec2:us-east-1:${AWS::AccountId}:instance/*
          - Sid: ReadSsmCommandResults
            Effect: Allow
            Action:
              - ssm:GetCommandInvocation
              - ssm:ListCommands
              - ssm:ListCommandInvocations
            Resource: "*"

Outputs:
  UserName:
    Description: Usuario CLI destinado exclusivamente a la tesis.
    Value: !Ref Deployer
