name: Deploy R6 API to AWS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tesis-r6-aws-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.TESIS_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TESIS_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Verify account and publish immutable image
        id: image
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = '479494991128'
          registry='479494991128.dkr.ecr.us-east-1.amazonaws.com'
          image="$registry/tesis-r4-api:r6-${GITHUB_SHA}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry" >/dev/null
          docker buildx build --platform linux/arm64 --push --tag "$image" --file Dockerfile .
          digest="$(aws ecr describe-images --repository-name tesis-r4-api \
            --image-ids "imageTag=r6-${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text)"
          test "${digest#sha256:}" != "$digest"
          echo "image=$registry/tesis-r4-api@$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy exact digest on existing instance
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          cat > /tmp/deploy-r6-api.sh <<'SCRIPT'
          set -euo pipefail
          public_env=/etc/peruactiva-public-whatsapp/runtime.env
          test "$(stat -c %a "$public_env")" = 600
          grep -qx 'PUBLIC_WHATSAPP_PHONE_NUMBER_ID=881564971710283' "$public_env"
          grep -q '^PRODUCTION_COORDINATION_SECRET=' "$public_env"
          docker exec peruactiva-public-whatsapp node -e \
            "fetch('http://127.0.0.1:8022/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
          api_env=/var/tmp/tesis-r6-api.env
          umask 077
          trap 'rm -f "$api_env"' EXIT
          docker inspect tesis-r4-api --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -v '^PRODUCTION_COORDINATION_' > "$api_env"
          printf '%s\n' 'PRODUCTION_COORDINATION_URL=http://peruactiva-public-whatsapp:8022' >> "$api_env"
          grep '^PRODUCTION_COORDINATION_SECRET=' "$public_env" >> "$api_env"
          previous_image="$(docker inspect -f '{{.Config.Image}}' tesis-r4-api)"
          aws ecr get-login-password --region us-east-1 | docker login \
            --username AWS --password-stdin 479494991128.dkr.ecr.us-east-1.amazonaws.com >/dev/null
          docker pull IMAGE_PLACEHOLDER >/dev/null
          docker rm -f tesis-r4-api >/dev/null
          run_container() {
            docker run -d --name tesis-r4-api --restart unless-stopped \
              --network tesis-r4 -p 3100:3100 \
              --env-file "$api_env" "$1" >/dev/null
          }
          ready() {
            docker exec tesis-r4-api node -e \
              "fetch('http://127.0.0.1:3100/v1/demos/week-03/assignment-scenarios').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))" \
              >/dev/null 2>&1
          }
          if ! run_container IMAGE_PLACEHOLDER; then
            run_container "$previous_image"
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if ready; then
              rm -f "$api_env"
              echo 'R6 API readiness: OK'
              exit 0
            fi
            sleep 2
          done
          docker rm -f tesis-r4-api >/dev/null 2>&1 || true
          run_container "$previous_image"
          rm -f "$api_env"
          echo 'Previous API image restored after failed readiness' >&2
          exit 1
          SCRIPT
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|g" /tmp/deploy-r6-api.sh
          encoded="$(base64 -w0 /tmp/deploy-r6-api.sh)"
          jq -n --arg command "printf %s '$encoded' | base64 -d | bash" \
            '{commands:[$command]}' > /tmp/r6-ssm-parameters.json
          command_id="$(aws ssm send-command --document-name AWS-RunShellScript \
            --instance-ids i-00ce35091a53ee070 \
            --parameters file:///tmp/r6-ssm-parameters.json \
            --query Command.CommandId --output text)"
          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id i-00ce35091a53ee070 --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut) echo "AWS deployment status: $status" >&2; exit 1 ;;
            esac
            sleep 5
          done
          test "$status" = Success
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id i-00ce35091a53ee070 --query StandardOutputContent --output text
          echo "Deployed thesis SHA: $GITHUB_SHA"
